name: Build & Package Runami Thermald

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Package KernelSU Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate scripts and configuration
        run: |
          echo ">>> Validating shell scripts syntax..."
          bash -n service.sh
          bash -n action.sh
          bash -n customize.sh
          bash -n uninstall.sh
          bash -n post-fs-data.sh
          bash -n bin/runami_daemon
          bash -n bin/runami_ctl
          echo ">>> Shell scripts validation passed!"

      - name: Run cipher and engine unit tests
        run: |
          chmod +x build.sh bin/runami_daemon bin/runami_ctl action.sh
          bash build.sh --test

      - name: Prepare module package
        run: |
          bash build.sh --package

      - name: Extract module version
        id: mod_version
        run: |
          VER=$(grep -E '^version=' module.prop | cut -d'=' -f2 | tr -d ' \r\n')
          echo "version=${VER:-v1.0.0}" >> $GITHUB_OUTPUT

      - name: Upload flashable module artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runami-Thermald-${{ steps.mod_version.outputs.version }}
          path: dist/package/
          if-no-files-found: error