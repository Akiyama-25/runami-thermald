name: Build & Package Runami Thermald

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Package KernelSU Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate scripts and configuration
        run: |
          echo ">>> Validating shell scripts syntax..."
          bash -n service.sh
          bash -n action.sh
          bash -n customize.sh
          bash -n uninstall.sh
          bash -n post-fs-data.sh
          bash -n bin/runami_daemon
          bash -n bin/runami_ctl
          echo ">>> Shell scripts validation passed!"

      - name: Run cipher and engine unit tests
        run: |
          chmod +x build.sh bin/runami_daemon bin/runami_ctl action.sh
          bash build.sh --test

      - name: Package flashable zip
        run: |
          bash build.sh --package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runami-Thermald-Module
          path: dist/*.zip
          if-no-files-found: error